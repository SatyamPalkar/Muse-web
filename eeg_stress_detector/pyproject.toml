[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-stress-detector"
version = "1.0.1"
authors = [
    {name = "Satyam Palkar", email = "satyam@example.com"},
]
description = "Advanced EEG stress detection system with session analysis and real-time monitoring"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "torch>=1.9.0",
    "xgboost>=1.5.0",
    "python-osc>=1.8.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[project.scripts]
eeg-stress-detector = "eeg_stress_detector.cli:main"

[project.urls]
Homepage = "https://github.com/SatyamPalkar/eeg-stress-detector"
Repository = "https://github.com/SatyamPalkar/eeg-stress-detector"
Issues = "https://github.com/SatyamPalkar/eeg-stress-detector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]