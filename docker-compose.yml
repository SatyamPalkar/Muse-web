version: '3.8'

services:
  # EEG API Server (Python Backend)
  eeg-api:
    build: .
    container_name: eeg-api-server
    ports:
      - "8001:8001"  # FastAPI server
      - "8000:8000"  # OSC server for Mind Monitor
    environment:
      - PYTHONPATH=/app
      - EEG_MODE=realtime
    volumes:
      - ./emotion_model_new.pth:/app/emotion_model_new.pth:ro
    command: python eeg_api_server.py --port 8001 --mode realtime --host 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eeg-network

  # Next.js Frontend
  frontend:
    build: .
    container_name: eeg-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - EEG_API_URL=http://eeg-api:8001
      - USE_MOCK_EEG=false
    depends_on:
      - eeg-api
    command: npm start
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eeg-network

  # Optional: Redis for session storage (for production)
  redis:
    image: redis:7-alpine
    container_name: eeg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eeg-network
    profiles:
      - production

  # Optional: Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: eeg-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - eeg-api
    restart: unless-stopped
    profiles:
      - production
    networks:
      - eeg-network

networks:
  eeg-network:
    driver: bridge

volumes:
  redis_data:
    driver: local

# Development override
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
